# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: PocketPortal
site_description: A self-hosted control plane for a physical mobile-device lab
site_url: https://vanyahuaman.github.io/PocketPortal/
repo_url: https://github.com/VanyaHuaman/PocketPortal
repo_name: VanyaHuaman/PocketPortal

theme:
  name: material
  font: false
  icon:
    logo: material/cellphone-link
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/pocketportal.css

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Development setup: getting-started/development.md
  - Configuration: configuration.md
  - API: api.md
  - Architecture: architecture.md
  - Operations:
      - Linux runtime: operations/linux-runtime.md
      - Clean-room testing: operations/clean-room.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

plugins:
  - search

strict: true
